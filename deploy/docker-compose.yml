# Local development dependencies. Phase 7 extends this to the full stack.
# Port 5433 avoids clashing with a locally installed PostgreSQL.
name: relay

services:
  postgres:
    image: postgres:17-alpine
    # Room for every app's pool (API 50 + worker 50 per instance) plus admin sessions; the default
    # 100 equalled one pool and made PostgreSQL refuse connections under load (docs/testing.md).
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay_local_dev # local-only container, not a secret
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.34.0
    environment:
      # Mailpit keeps only 500 messages by default and silently drops older ones, which would
      # break every "nothing sent twice" check that counts what arrived.
      MP_MAX_MESSAGES: "200000"
    ports:
      - "1025:1025" # SMTP sink: nothing leaves this container
      - "8025:8025" # web UI and API: http://localhost:8025

  # --- Observability (docker compose --profile observability up -d) ---
  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver # services push metrics over OTLP/HTTP
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    profiles: [observability]
    ports:
      - "16686:16686" # UI
      - "4318:4318" # OTLP/HTTP traces

  grafana:
    image: grafana/grafana:13.3.2
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin # local only
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000" # 3000 is often taken by dev servers
    depends_on: [prometheus]

volumes:
  pgdata:
