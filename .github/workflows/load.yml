name: load

# Accept-path load test on a clean runner: a laptop with other apps open varies by more than 10x
# between identical runs (docs/testing.md). Three rounds of 1 tenant vs 20 tenants, alternated,
# each from a fresh database. Manual only: it takes about 25 minutes.
on:
  workflow_dispatch:
    inputs:
      rates:
        description: Requests per second for each step
        default: "250,500,750,1000,1250"

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build the stack images
        run: docker compose -f compose.yaml -f bench/stack/compose.bench.yaml build api

      - name: Run 1 vs 20 tenants, three rounds
        env:
          RATES: ${{ inputs.rates }}
        run: |
          nproc
          for round in 1 2 3; do
            for tenants in 1 20; do
              bench/run-load.sh "$tenants" "ci-tenants-$tenants-r$round" "$RATES"
            done
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-${{ github.run_number }}
          path: bench/results/load/ci-*.json
          retention-days: 90
