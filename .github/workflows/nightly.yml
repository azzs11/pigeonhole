name: nightly

# MailChaos against the latest main. Fails if the full system loses mail or duplicates
# more than the baselines (bench/check_mailchaos.py). Results are kept as an artifact.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mailchaos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Run MailChaos
        run: bench/run-mailchaos.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mailchaos-${{ github.run_number }}
          path: bench/results/mailchaos
          retention-days: 30
